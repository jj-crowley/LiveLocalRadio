server {
    listen 80;
    server_name route666.live www.route666.live;

    client_max_body_size 25m;

    # Serve uploaded flyers, images, and MP3s directly from disk in production.
    location /uploads/ {
        alias /var/www/route666/storage/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Let Next.js resolve root-level artist block fallback paths.
    location /radio/_root/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve the Route666 streaming MP3 rotation directly from disk in production.
    location /radio/ {
        alias /var/www/route666/storage/radio/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
        types {
            audio/mpeg mp3;
        }
    }

    # Let Next.js resolve masked video IDs before the static video alias.
    location /videos/id/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve local video files for embeddable players.
    location /videos/ {
        alias /var/www/route666/storage/videos/;
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
        types {
            video/mp4 mp4;
            video/webm webm;
            video/ogg ogg ogv;
        }
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
